name: Build Fork Wheel

on:
  push:
    branches: [shared-context]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release'
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone and build vtk-js fork
        run: |
          git clone --depth 1 --branch shared-context https://github.com/PaulHax/vtk-js.git
          cd vtk-js && npm ci && npm run build:esm
          cd dist/esm && npm link

      - name: Clone and build vue-vtk-js fork
        run: |
          git clone --depth 1 --branch shared-context https://github.com/PaulHax/vue-vtk-js.git
          cd vue-vtk-js && npm ci && npm link @kitware/vtk.js && npm run build

      - name: Copy bundle to trame-vtk
        run: |
          mkdir -p src/trame_vtk/modules/common/serve
          cp vue-vtk-js/dist/vue-vtk.umd.js src/trame_vtk/modules/common/serve/trame-vtk.js

      - name: Build wheel
        run: pip install build && python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: trame-vtk-fork-wheel
          path: dist/*.whl

      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=v${VERSION}-shared-context.${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/shared-context' || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag || github.ref_name }}
          files: dist/*.whl
          prerelease: true
